<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Texto IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Detector de Texto IA</h1>
            <p>Analiza si un texto ha sido generado por Inteligencia Artificial de forma offline.</p>
        </header>

        <main class="layout">
            <section class="input-section">
                <textarea id="text-input" placeholder="Pega tu texto aquí (mínimo 50 caracteres)..."></textarea>
                <button id="analyze-btn">Analizar Texto</button>
                <p id="error-message" class="error hidden"></p>
            </section>

            <section id="results-section" class="results-section hidden">
                <div class="gauge-container">
                    <!-- Velocímetro SVG -->
                    <svg viewBox="0 0 200 120" class="gauge">
                        <!-- Fondo del arco -->
                        <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#2a2a2a" stroke-width="20" stroke-linecap="round"/>
                        <!-- Arco de progreso -->
                        <path id="gauge-progress" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#4CAF50" stroke-width="20" stroke-linecap="round" stroke-dasharray="251.32" stroke-dashoffset="251.32"/>
                        <!-- Marcas (Ticks) -->
                        <g stroke="#555" stroke-width="2">
                            <line x1="20" y1="100" x2="25" y2="100" />
                            <line x1="33" y1="55" x2="37" y2="58" />
                            <line x1="60" y1="25" x2="62" y2="29" />
                            <line x1="100" y1="20" x2="100" y2="25" />
                            <line x1="140" y1="25" x2="138" y2="29" />
                            <line x1="167" y1="55" x2="163" y2="58" />
                            <line x1="180" y1="100" x2="175" y2="100" />
                        </g>
                        <!-- Textos del velocímetro -->
                        <g fill="#888" font-size="10" text-anchor="middle" font-family="sans-serif">
                            <text x="20" y="115">0</text>
                            <text x="100" y="15">50</text>
                            <text x="180" y="115">100</text>
                        </g>
                        <!-- Aguja -->
                        <g id="gauge-needle" transform="rotate(-90, 100, 100)">
                            <polygon points="100,25 96,100 104,100" fill="#fff" />
                        </g>
                        <!-- Centro de la aguja -->
                        <circle cx="100" cy="100" r="12" fill="#111" stroke="#333" stroke-width="2"/>
                        <circle cx="100" cy="100" r="4" fill="#fff"/>
                    </svg>
                    
                    <div class="percentage-display">
                        <span id="percentage-text">0</span><span class="percent-symbol">%</span>
                    </div>
                    <p id="result-label" class="result-label">Probabilidad de IA</p>
                </div>

                <div class="reasons-container">
                    <h3>Análisis detallado</h3>
                    <ul id="reasons-list"></ul>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
