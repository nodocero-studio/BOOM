<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural AI Detector</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Fondo de rejilla -->
    <div class="grid-background"></div>
    
    <div class="hud-container">
        <!-- Cabecera HUD -->
        <header class="hud-header">
            <div class="status-indicator">
                <span class="pulse-dot"></span> SYS.ONLINE
            </div>
            <h1 class="glitch-text" data-text="NEURAL TEXT ANALYZER">NEURAL TEXT ANALYZER</h1>
            <div class="version-info">v.2.0.4 // OFFLINE_MODE</div>
        </header>

        <main class="hud-layout">
            <!-- Panel de Entrada -->
            <section class="panel input-panel">
                <div class="panel-header">
                    <span>> INPUT_DATA</span>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="text-input" placeholder="Inicializando escáner de texto... Esperando entrada de datos (mínimo 50 caracteres)." spellcheck="false"></textarea>
                    <div class="scan-line"></div>
                </div>
                <button id="analyze-btn" class="cyber-button">
                    <span class="btn-glitch">EJECUTAR ANÁLISIS</span>
                    <div class="btn-bg"></div>
                </button>
                <p id="error-message" class="error hidden">[!] ERROR: DATOS INSUFICIENTES</p>
            </section>

            <!-- Panel de Resultados -->
            <section id="results-section" class="panel results-panel hidden">
                <div class="panel-header">
                    <span>> ANALYSIS_RESULT</span>
                </div>
                
                <div class="gauge-container">
                    <!-- Velocímetro Táctico -->
                    <svg viewBox="0 0 200 120" class="gauge">
                        <!-- Fondo del arco -->
                        <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="15" stroke-linecap="round"/>
                        <!-- Arco de progreso -->
                        <path id="gauge-progress" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--accent)" stroke-width="15" stroke-linecap="round" stroke-dasharray="251.32" stroke-dashoffset="251.32"/>
                        
                        <!-- Marcas tácticas -->
                        <g stroke="rgba(255,255,255,0.2)" stroke-width="2">
                            <line x1="20" y1="100" x2="25" y2="100" />
                            <line x1="33" y1="55" x2="37" y2="58" />
                            <line x1="60" y1="25" x2="62" y2="29" />
                            <line x1="100" y1="20" x2="100" y2="25" />
                            <line x1="140" y1="25" x2="138" y2="29" />
                            <line x1="167" y1="55" x2="163" y2="58" />
                            <line x1="180" y1="100" x2="175" y2="100" />
                        </g>

                        <!-- Aguja -->
                        <g id="gauge-needle" transform="rotate(-90, 100, 100)">
                            <polygon points="100,25 97,100 103,100" fill="var(--accent)" />
                            <!-- Puntero láser -->
                            <circle cx="100" cy="25" r="3" fill="#fff" />
                        </g>
                        <!-- Centro -->
                        <circle cx="100" cy="100" r="10" fill="#111" stroke="var(--accent)" stroke-width="2"/>
                        <circle cx="100" cy="100" r="3" fill="var(--accent)"/>
                    </svg>
                    
                    <div class="percentage-display">
                        <span id="percentage-text" class="glow-text">0</span><span class="percent-symbol">%</span>
                    </div>
                    <div id="result-label" class="result-label">SISTEMA EN ESPERA</div>
                </div>

                <div class="terminal-logs">
                    <div class="terminal-header">// LOG_DE_DETECCIÓN</div>
                    <ul id="reasons-list"></ul>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
